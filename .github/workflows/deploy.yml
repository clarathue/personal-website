name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [force-rebuild]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      # Checkout source code
      - name: Checkout
        uses: actions/checkout@v4
      
      # Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      
      # Install dependencies
      - name: Install dependencies
        run: npm ci
      
      # Build the project (output to dist/)
      - name: Build
        run: |
          npm run build
          # Verify build output
          ls -la dist/
          ls -la dist/assets/
        env:
          VITE_BASE_URL: ''
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
      
      # 404.html, .nojekyll und je Route eine <route>.html schreibt
      # scripts/write-route-pages.mjs (postbuild).

      # Add CNAME for custom domain
      - name: Add CNAME file
        run: echo "thuemecke.net" > dist/CNAME

      # Setup GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # Upload dist/ as artifact for deployment
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 

  # Schicht 7: dieselben @smoke-Specs gegen die gerade deployte Seite.
  # Wartet, bis Pages den neuen Stand ausliefert (<meta name="build-sha">).
  # Rückweg bei Rot: letzten grünen Deploy-Lauf neu starten oder Revert auf main.
  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Warten auf den neuen Stand
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fsS "https://thuemecke.net/?sha-check=$i" | grep -o 'name="build-sha" content="[^"]*"' | cut -d'"' -f4 || true)
            echo "Versuch $i: live=${live:-?} erwartet=$GITHUB_SHA"
            [ "$live" = "$GITHUB_SHA" ] && exit 0
            sleep 10
          done
          echo "Pages liefert nach 10 Minuten noch nicht den neuen Stand aus." >&2
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke gegen Prod
        run: npm run test:smoke
        env:
          BASE_URL: https://thuemecke.net

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-deploy
          path: playwright-report/
          retention-days: 7
