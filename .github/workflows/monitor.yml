name: Monitor thuemecke.net

# Stündlich geplanter Check gegen Prod, nur lesend (siehe e2e/smoke.spec.ts).
# Der Takt ist von GitHub nicht zugesichert; Messwerte und Schwelle für ein
# ausbleibendes Ergebnis stehen in CLAUDE.md, Abschnitt „Was hier besonders ist“.
# Rot → GitHub-Benachrichtigung an den, der den Cron zuletzt geändert hat.
# GitHub schaltet geplante Workflows nach 60 Tagen ohne Repo-Aktivität ab.
# Dagegen schaltet sich der Workflow monatlich per API selbst wieder ein
# (Job keepalive), das setzt die Frist zurück – ohne Commit, ohne Deploy.
on:
  schedule:
    - cron: '23 * * * *'
    - cron: '41 4 1 * *'   # keepalive, am 1. jedes Monats
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Adresse, gegen die geprüft wird'
        default: 'https://thuemecke.net'
      keepalive:
        description: 'Nur den Keepalive ausführen'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event.schedule != '41 4 1 * *' && !inputs.keepalive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke gegen Prod
        run: npm run test:smoke
        env:
          BASE_URL: ${{ inputs.base_url || 'https://thuemecke.net' }}

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  keepalive:
    if: github.event.schedule == '41 4 1 * *' || inputs.keepalive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Workflow erneut einschalten (setzt die 60-Tage-Frist zurück)
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Zustand prüfen
        run: |
          state=$(gh api "repos/${{ github.repository }}/actions/workflows/monitor.yml" --jq .state)
          echo "monitor.yml: $state"
          test "$state" = "active"
        env:
          GH_TOKEN: ${{ github.token }}
