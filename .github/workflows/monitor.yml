name: Monitor thuemecke.net

# Stündlicher Check gegen Prod, nur lesend (siehe e2e/smoke.spec.ts).
#
# Angestoßen von außen: die agent-runtime-Box schickt stündlich zur Minute 23 ein
# repository_dispatch (event_type monitor). GitHubs eigener Zeitplan hat diesen
# Workflow ab dem 16.11.2026 nie ausgelöst, auch nicht nach Ab- und Anschalten
# und nach einem Push mit neuer Minute. Ohne schedule-Trigger gilt auch die
# 60-Tage-Abschaltung nicht mehr, der frühere Keepalive-Job entfällt.
#
# Alarm: GitHub mailt einen roten Lauf an den, der ihn ausgelöst hat, hier also an
# die App der Box. Deshalb legt der Job bei Rot ein Issue an (oder kommentiert das
# offene) und erwähnt darin die Inhaberin. Wird Prod wieder grün, schließt er es.
on:
  repository_dispatch:
    types: [monitor]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Adresse, gegen die geprüft wird'
        default: 'https://thuemecke.net'

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: true

env:
  PROD_URL: https://thuemecke.net
  ISSUE_TITEL: Monitor rot – thuemecke.net

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      BASE_URL: ${{ inputs.base_url || 'https://thuemecke.net' }}
      GH_TOKEN: ${{ github.token }}
      LAUF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke gegen Prod
        run: npm run test:smoke

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Alarm als Issue
        if: failure()
        run: |
          nummer=$(gh issue list --state open --search "\"$ISSUE_TITEL\" in:title" --json number --jq '.[0].number // empty')
          text="Smoke gegen $BASE_URL rot: $LAUF_URL"
          if [ -n "$nummer" ]; then
            gh issue comment "$nummer" --body "@${{ github.repository_owner }} weiterhin rot. $text"
          else
            gh issue create --title "$ISSUE_TITEL" --body "@${{ github.repository_owner }} $text"
          fi

      - name: Entwarnung
        if: success() && env.BASE_URL == env.PROD_URL
        run: |
          nummer=$(gh issue list --state open --search "\"$ISSUE_TITEL\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$nummer" ]; then
            gh issue close "$nummer" --comment "Wieder grün: $LAUF_URL"
          fi
